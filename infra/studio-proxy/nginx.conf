worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # ── PostgREST upstream ────────────────────────────────────────────────
    upstream postgrest {
        server supabase-rest:3000;
    }

    # ── postgres-meta upstream ────────────────────────────────────────────
    upstream meta {
        server supabase-meta:8080;
    }

    server {
        listen 8000;

        # ── REST API (PostgREST) ──────────────────────────────────────────
        location /rest/v1/ {
            proxy_pass http://postgrest/rest/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Forward Authorization header for PostgREST JWT
            proxy_set_header Authorization $http_authorization;
            proxy_set_header apikey $http_apikey;
        }

        # ── postgres-meta API ─────────────────────────────────────────────
        location /pg/ {
            proxy_pass http://meta/;
            proxy_set_header Host $host;
        }

        # ── Stub: platform profile (prevents Studio 500 on startup) ──────
        location = /platform/profile {
            add_header Content-Type application/json;
            return 200 '{"id":"local","primary_email":"admin@local.dev","username":"local","first_name":"Local","last_name":"Dev","gotrue_id":"local"}';
        }

        # ── Stub: platform organizations ──────────────────────────────────
        location = /platform/organizations {
            add_header Content-Type application/json;
            return 200 '[{"id":"local","name":"Job Intelligent","slug":"local","created_at":"2024-01-01T00:00:00Z","subscription_id":"local"}]';
        }

        # ── Stub: platform projects ───────────────────────────────────────
        location /platform/projects {
            add_header Content-Type application/json;
            return 200 '[{"id":"local","name":"local","ref":"default","status":"ACTIVE_HEALTHY","region":"local","organization_id":"local","cloud_provider":"local","created_at":"2024-01-01T00:00:00Z"}]';
        }

        # ── Stub: auth endpoints (prevents 500 on auth feature attempts) ──
        location /auth/v1/ {
            add_header Content-Type application/json;
            return 200 '{}';
        }

        # ── Stub: storage endpoints ───────────────────────────────────────
        location /storage/v1/ {
            add_header Content-Type application/json;
            return 200 '{"message":"Storage not available in local dev"}';
        }

        # ── Catch-all: return empty JSON for unknown admin routes ─────────
        location / {
            add_header Content-Type application/json;
            return 404 '{"error":"Not found"}';
        }
    }
}
