x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "job-etl-secret-key-2026"
    SUPABASE_URL: ${SUPABASE_URL}
    SUPABASE_KEY: ${SUPABASE_KEY}
    REDIS_URL: redis://redis:6379/0
    SBERT_MODEL: ${SBERT_MODEL:-all-MiniLM-L6-v2}
    SPACY_MODEL: ${SPACY_MODEL:-fr_core_news_md}
    DATABASE_MODE: ${DATABASE_MODE:-supabase}
    LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://postgres:postgres@app-db:5432/job_intelligent}
    ADZUNA_APP_ID: ${ADZUNA_APP_ID}
    ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
    JSEARCH_API_KEY: ${JSEARCH_API_KEY}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./scrapers:/opt/airflow/scrapers
    - ./ingestion:/opt/airflow/ingestion
    - ./pipeline:/opt/airflow/pipeline
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── Local application PostgreSQL (pgvector) ───────────────────────────────
  app-db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${LOCAL_DB_NAME:-job_intelligent}
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-postgres} -d ${LOCAL_DB_NAME:-job_intelligent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local database UI (Adminer) ──────────────────────────────────────────
  db-ui:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: app-db
    depends_on:
      app-db:
        condition: service_healthy

  # ── Supabase-like local UI (Studio + Postgres Meta) ──────────────────────
  supabase-meta:
    image: supabase/postgres-meta:v0.96.3
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: app-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${LOCAL_DB_NAME:-job_intelligent}
      PG_META_DB_USER: ${LOCAL_DB_USER:-postgres}
      PG_META_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      PG_META_DB_SSL_MODE: disable
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-local-dev-meta-crypto-key-32chars}
    depends_on:
      app-db:
        condition: service_healthy

  supabase-studio:
    image: supabase/studio:2026.04.27-sha-5f60601
    ports:
      - "54323:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_HOST: app-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${LOCAL_DB_NAME:-job_intelligent}
      POSTGRES_USER: ${LOCAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: Job Intelligent
      DEFAULT_PROJECT_NAME: local
      SUPABASE_URL: http://localhost
      SUPABASE_PUBLIC_URL: http://localhost
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzE2MjQwMDAwLCJleHAiOjIwMzE3NzYwMDB9.e30.j9x2xh3V6M7xYBf8v16G8N2qJQ1yxzvH2pGh5Q7qUqc}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3MTYyNDAwMDAsImV4cCI6MjAzMTc3NjAwMH0.e30.8Jgq3v9wqgR7Wcq1vS6w2t5zQ9a4WzT8u9yM7wK6J4I}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-chars}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    depends_on:
      supabase-meta:
        condition: service_started

  # ── Airflow metadata database ─────────────────────────────────────────────
  airflow-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  # ── Airflow init (run migrations) ─────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate && airflow users create
      --username admin --password admin --firstname Admin
      --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  # ── Airflow webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler ────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── FastAPI application ───────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      DATABASE_MODE: ${DATABASE_MODE:-supabase}
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://postgres:postgres@app-db:5432/job_intelligent}
      REDIS_URL: redis://redis:6379/0
      SBERT_MODEL: ${SBERT_MODEL:-all-MiniLM-L6-v2}
      SPACY_MODEL: ${SPACY_MODEL:-fr_core_news_md}
      API_DEBUG: ${API_DEBUG:-false}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY}
    volumes:
      - ./api:/app/api
      - ./etl:/app/etl
      - ./ingestion:/app/ingestion
      - ./ai_services:/app/ai_services
      - ./tests:/app/tests
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-db-data:
  airflow-db-data:
  airflow-logs:
  redis-data:
